name: backend-ci

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    concurrency:
      group: backend-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # 소스 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 설치 및 Gradle 캐시 활성화
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Gradle Wrapper 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # PR: 코드젠 + 테스트 수행
      - name: Generate jOOQ + Test (PR only)
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon generateJooqDsl test

      # push(main/develop): 코드젠 + 테스트 + bootJar 단 한 번 수행
      - name: Generate jOOQ + Test + bootJar (push only)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          ./gradlew --no-daemon generateJooqDsl test bootJar

      # push에서만 산출물 검증
      - name: Verify app.jar exists (push only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ls -lah build/libs || true
          test -f build/libs/app.jar

      # Docker Buildx 설정 (push에서만)
      - name: Set up Docker Buildx (push only)
        if: github.event_name != 'pull_request'
        uses: docker/setup-buildx-action@v3

      # 브랜치별 태그 정책 설정 (push에서만)
      - name: Set image tags by branch (push only)
        if: github.event_name != 'pull_request'
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          REF_NAME="${GITHUB_REF_NAME}"
          SHA7="${GITHUB_SHA::7}"

          if [[ "${REF_NAME}" == "main" ]]; then
            echo "immutable_tag=prod-${SHA7}" >> "${GITHUB_OUTPUT}"
            echo "latest_tag=prod-latest" >> "${GITHUB_OUTPUT}"
          elif [[ "${REF_NAME}" == "develop" ]]; then
            echo "immutable_tag=dev-${SHA7}" >> "${GITHUB_OUTPUT}"
            echo "latest_tag=dev-latest" >> "${GITHUB_OUTPUT}"
          else
            echo "immutable_tag=ci-${SHA7}" >> "${GITHUB_OUTPUT}"
            echo "latest_tag=ci-latest" >> "${GITHUB_OUTPUT}"
          fi

      # 이미지명 소문자로 정규화 (push에서만)
      - name: Prepare image name (lowercase) (push only)
        if: github.event_name != 'pull_request'
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      # GHCR 로그인 (push에서만)
      - name: Login to GHCR (push only)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # OTel Java agent 다운로드 (push에서만)
      - name: Download OpenTelemetry Java agent (push only)
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p otel
          curl -fsSLo otel/opentelemetry-javaagent.jar \
            https://github.com/open-telemetry/opentelemetry-java-instrumentation/releases/latest/download/opentelemetry-javaagent.jar

      # 이미지 빌드 + 푸시 (push에서만)
      - name: Build and push image (push only)
        if: github.event_name != 'pull_request'
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.vars.outputs.immutable_tag }}
            ${{ steps.image.outputs.name }}:${{ steps.vars.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # infra 레포 CD 워크플로우 트리거 (push에서만, digest 전달)
      - name: Trigger infra CD (push only)
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          TOKEN: ${{ secrets.INFRA_TOKEN }}
          OWNER: ${{ secrets.INFRA_OWNER }}
          REPO: ${{ secrets.INFRA_REPO }}
          IMAGE: ${{ steps.image.outputs.name }}@${{ steps.docker_build.outputs.digest }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [[ "${BRANCH}" == "main" ]]; then
            DEPLOY_ENV="prod"
          elif [[ "${BRANCH}" == "develop" ]]; then
            DEPLOY_ENV="dev"
          else
            echo "Unsupported branch for CD: ${BRANCH}"
            exit 1
          fi

          WORKFLOW_FILE="deploy.yml"

          STATUS="$(curl -sS -o /tmp/infra_cd_resp.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${OWNER}/${REPO}/actions/workflows/${WORKFLOW_FILE}/dispatches" \
            -d "$(cat <<JSON
          {
            "ref": "main",
            "inputs": {
              "env": "${DEPLOY_ENV}",
              "image": "${IMAGE}"
            }
          }
          JSON
          )")"

          if [[ "${STATUS}" != "204" ]]; then
            echo "Infra CD trigger failed (status=${STATUS})"
            cat /tmp/infra_cd_resp.json || true
            exit 1
          fi
