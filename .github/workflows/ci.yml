name: backend-ci

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    concurrency:
      group: backend-ci-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      # 소스 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 21 설치 및 Gradle 캐시 활성화
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # Gradle Wrapper 실행 권한 부여
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 테스트 및 bootJar를 단 한 번 수행하여 산출물(app.jar)을 생성
      - name: Test + bootJar (single build)
        run: ./gradlew --no-daemon test bootJar

      # CI 산출물(app.jar) 존재 여부를 강제 확인
      - name: Verify app.jar exists
        shell: bash
        run: |
          set -euo pipefail
          ls -lah build/libs || true
          test -f build/libs/app.jar

      # Docker Buildx 설정
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 브랜치별 태그 정책 설정
      - name: Set image tags by branch
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          REF_NAME="${GITHUB_REF_NAME}"
          SHA7="${GITHUB_SHA::7}"

          if [[ "${REF_NAME}" == "main" ]]; then
            echo "immutable_tag=prod-${SHA7}" >> "${GITHUB_OUTPUT}"
            echo "latest_tag=prod-latest" >> "${GITHUB_OUTPUT}"
          elif [[ "${REF_NAME}" == "develop" ]]; then
            echo "immutable_tag=dev-${SHA7}" >> "${GITHUB_OUTPUT}"
            echo "latest_tag=dev-latest" >> "${GITHUB_OUTPUT}"
          else
            echo "immutable_tag=ci-${SHA7}" >> "${GITHUB_OUTPUT}"
            echo "latest_tag=ci-latest" >> "${GITHUB_OUTPUT}"
          fi

      # 이미지명 소문자로 정규화
      - name: Prepare image name (lowercase)
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')"
          echo "name=${IMAGE_NAME}" >> "${GITHUB_OUTPUT}"

      # PR에서는 푸시하지 않으므로 로그인 생략
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.vars.outputs.immutable_tag }}
            ${{ steps.image.outputs.name }}:${{ steps.vars.outputs.latest_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
