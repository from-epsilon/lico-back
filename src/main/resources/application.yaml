spring:
  application:
    name: nagginggnome
  lifecycle:
    timeout-per-shutdown-phase: 30s
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jackson:
    default-property-inclusion: NON_NULL
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

server:
  shutdown: GRACEFUL

jwt:
  secret: ${JWT_SECRET}
  access-token-exp: ${ACCESS_TOKEN_EXP:3600}
  refresh-token-exp: ${REFRESH_TOKEN_EXP:1209600}
  issuer: ${JWT_ISSUER:nagginggnome}

social:
  google:
    client-id: ${GOOGLE_CLIENT_ID}

fcm:
  credentialsPath: ${FCM_CREDENTIALS_PATH:}

security:
  token-hash:
    pepper: ${TOKEN_HASH_PEPPER}

management:
  server:
    port: 8000
  endpoints:
    web:
      exposure:
        include:
          - health
  endpoint:
    health:
      show-details: NEVER
