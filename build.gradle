plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.2.21'
    id 'org.jetbrains.kotlin.plugin.spring' version '2.2.21'
    id 'org.springframework.boot' version '4.0.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.asciidoctor.jvm.convert' version '4.0.5'
    id 'org.jetbrains.kotlin.plugin.jpa' version '2.2.21'
}

group = 'com.epsilon'
version = '0.0.1-SNAPSHOT'
description = 'Nagging Gnome'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

jar {
    enabled = false
}

bootJar {
    archiveFileName = 'app.jar'
}

repositories {
    mavenCentral()
}

ext {
    set('snippetsDir', file("build/generated-snippets"))
}

def jooqGeneratedDirFile = layout.buildDirectory
        .dir("generated-src/jooq/main")
        .get()
        .asFile

sourceSets {
    jooqCodegen {
        kotlin.srcDir("src/jooqCodegen/kotlin")
    }
    main {
        kotlin.srcDir(jooqGeneratedDirFile.absolutePath)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-hateoas'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-jooq'
    implementation 'org.postgresql:postgresql'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    implementation 'tools.jackson.module:jackson-module-kotlin'
    implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
    implementation 'com.google.firebase:firebase-admin:9.7.0'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.1'
    implementation 'net.javacrumbs.shedlock:shedlock-spring:7.5.0'
    implementation 'net.javacrumbs.shedlock:shedlock-provider-jdbc-template:7.5.0'
    implementation 'net.logstash.logback:logstash-logback-encoder:9.0'
    implementation 'org.mnode.ical4j:ical4j:4.2.3'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.13.0'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.13.0'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    testImplementation 'org.springframework.boot:spring-boot-restdocs'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit5'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    jooqCodegenImplementation "org.testcontainers:postgresql:1.20.4"
    jooqCodegenImplementation "org.flywaydb:flyway-core"
    jooqCodegenImplementation "org.flywaydb:flyway-database-postgresql"
    jooqCodegenImplementation "org.jooq:jooq-codegen:3.19.29"
    jooqCodegenImplementation "org.jooq:jooq-meta:3.19.29"
    jooqCodegenImplementation "org.jooq:jooq:3.19.29"
    jooqCodegenRuntimeOnly "org.postgresql:postgresql"
}

kotlin {
    compilerOptions {
        freeCompilerArgs.addAll '-Xjsr305=strict', '-Xannotation-default-target=param-property'
    }
}

tasks.register("generateJooqDsl", JavaExec) {
    group = "jooq"
    dependsOn tasks.named("compileJooqCodegenKotlin")
    classpath = sourceSets.jooqCodegen.runtimeClasspath
    mainClass = "com.epsilon.nagginggnome.build.JooqDslGenerator"
    args jooqGeneratedDirFile.absolutePath
}

def isCi = (System.getenv("GITHUB_ACTIONS") ?: "false").toBoolean()

tasks.named('compileKotlin') {
    if (isCi) {
        dependsOn tasks.named('generateJooqDsl')
    }
}

tasks.named('test') {
    outputs.dir snippetsDir
    failOnNoDiscoveredTests = false
    useJUnitPlatform()
}

tasks.named('asciidoctor') {
    inputs.dir snippetsDir
    dependsOn test
}
